name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rajlabs-cert-signer/backend/requirements.txt pytest httpx

      - name: Run Backend Pytest Suite
        run: |
          cd rajlabs-cert-signer
          PYTHONPATH=backend pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rajlabs-cert-signer/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rajlabs-cert-signer/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
